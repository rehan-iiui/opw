<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open World 3D</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="loadingScreen">
    <div class="loading-title">OPEN WORLD 3D</div>
    <div class="loading-bar">
      <div id="loadingProgress"></div>
    </div>
    <div id="loadingText">Loading world...</div>
  </div>

  <div id="gameUI">
    <div class="top-left">
      <div class="game-title">OPEN WORLD</div>
      <div class="status">● ONLINE</div>
    </div>

    <div class="controls-help">
      <span>W A S D</span> Move
      <span>SPACE</span> Jump
      <span>MOUSE</span> Camera
      <span>ESC</span> Release Mouse
    </div>

    <div id="crosshair">+</div>

    <div class="bottom-left">
      <div class="player-info">
        <div class="health-label">HEALTH</div>
        <div class="health-bar">
          <div class="health-fill"></div>
        </div>
      </div>
    </div>

    <div class="bottom-right">
      <div class="speed">SPEED <span id="speedValue">0</span></div>
    </div>
  </div>

  <div id="startScreen">
    <div class="start-box">
      <h1>OPEN WORLD 3D</h1>
      <p>Third-Person Prototype</p>
      <button id="startButton">START GAME</button>
      <div class="start-info">
        WASD to move<br>
        SPACE to jump<br>
        Move mouse to control camera
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
