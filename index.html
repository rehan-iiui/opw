<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWorld3D</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="loadingScreen">
        <div class="loadingBox">
            <h1>OpenWorld3D</h1>
            <p>Loading world...</p>
            <div class="loadingBar">
                <div id="loadingProgress"></div>
            </div>
        </div>
    </div>

    <div id="startScreen">
        <div class="startBox">
            <h1>OpenWorld3D</h1>
            <p>Explore the city</p>
            <button id="startButton">START GAME</button>
        </div>
    </div>

    <div id="hud">
        <div class="hudTop">
            <div class="healthBox">
                <span>HEALTH</span>
                <div class="healthBar">
                    <div id="healthFill"></div>
                </div>
            </div>

            <div class="moneyBox">
                $<span id="money">500</span>
            </div>
        </div>

        <div class="controls">
            <b>W A S D</b> Move &nbsp;
            <b>SHIFT</b> Run &nbsp;
            <b>SPACE</b> Jump
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- PLAYER SYSTEM -->
    <script src="player/player.js"></script>
    <script src="player/movement.js"></script>
    <script src="player/camera.js"></script>
    <script src="player/animation.js"></script>

    <!-- MAIN GAME -->
    <script src="script.js"></script>

</body>
</html>
